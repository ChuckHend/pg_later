name: Build Postgres with pg_later

defaults:
  run:
    shell: bash

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  packages: write

env:
  # fork PRs get a read-only GITHUB_TOKEN and cannot push to ghcr.io
  PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  build_and_push_amd64:
    name: Build and push AMD64 images
    if: github.repository_owner == 'ChuckHend'
    runs-on:
      - ubuntu-latest
    outputs:
      short_sha: ${{ steps.versions.outputs.SHORT_SHA }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set version strings
        id: versions
        run: |
          TAG_VER=$(grep -m 1 '^version' Cargo.toml | sed -e 's/[^"]*"\([^"]*\)"/\1/')
          PGRX_VER=$(grep -m 1 '^pgrx = ' Cargo.toml | sed -e 's/[^"]*"=\{0,1\}\([^"]*\)"/\1/')
          test -n "$TAG_VER" && test -n "$PGRX_VER"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "TAG_VER=$TAG_VER" >> $GITHUB_OUTPUT
          echo "PGRX_VER=$PGRX_VER" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push -- Commit
        # push commit build when not a release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
            docker build \
                --build-arg PGRX_VER=${{ steps.versions.outputs.PGRX_VER }} \
                -f ./images/pglater-pg/Dockerfile \
                -t ghcr.io/chuckhend/pglater-pg:${{ steps.versions.outputs.SHORT_SHA }}-amd64 .
            if [ "$PUSH" = "true" ]; then
                docker push ghcr.io/chuckhend/pglater-pg:${{ steps.versions.outputs.SHORT_SHA }}-amd64
            fi

      - name: Build and push -- Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
            docker build \
                --build-arg PGRX_VER=${{ steps.versions.outputs.PGRX_VER }} \
                -f ./images/pglater-pg/Dockerfile \
                -t ghcr.io/chuckhend/pglater-pg:v${{ steps.versions.outputs.TAG_VER }}-amd64 \
                -t ghcr.io/chuckhend/pglater-pg:latest-amd64 .
            docker push ghcr.io/chuckhend/pglater-pg:v${{ steps.versions.outputs.TAG_VER }}-amd64
            docker push ghcr.io/chuckhend/pglater-pg:latest-amd64

  build_and_push_arm64:
    name: Build and push ARM64 images
    if: github.repository_owner == 'ChuckHend'
    runs-on:
      - ubicloud-standard-2-arm-ubuntu-2204
    outputs:
      short_sha: ${{ steps.versions.outputs.SHORT_SHA }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set version strings
        id: versions
        run: |
          TAG_VER=$(grep -m 1 '^version' Cargo.toml | sed -e 's/[^"]*"\([^"]*\)"/\1/')
          PGRX_VER=$(grep -m 1 '^pgrx = ' Cargo.toml | sed -e 's/[^"]*"=\{0,1\}\([^"]*\)"/\1/')
          test -n "$TAG_VER" && test -n "$PGRX_VER"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "TAG_VER=$TAG_VER" >> $GITHUB_OUTPUT
          echo "PGRX_VER=$PGRX_VER" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push -- Commit
        # push commit build when not a release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
            docker build \
                --build-arg PGRX_VER=${{ steps.versions.outputs.PGRX_VER }} \
                -f ./images/pglater-pg/Dockerfile \
                --platform linux/arm64 \
                -t ghcr.io/chuckhend/pglater-pg:${{ steps.versions.outputs.SHORT_SHA }}-arm64 .
            if [ "$PUSH" = "true" ]; then
                docker push ghcr.io/chuckhend/pglater-pg:${{ steps.versions.outputs.SHORT_SHA }}-arm64
            fi

      - name: Build and push -- Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
            docker build \
                --build-arg PGRX_VER=${{ steps.versions.outputs.PGRX_VER }} \
                -f ./images/pglater-pg/Dockerfile \
                --platform linux/arm64 \
                -t ghcr.io/chuckhend/pglater-pg:v${{ steps.versions.outputs.TAG_VER }}-arm64 \
                -t ghcr.io/chuckhend/pglater-pg:latest-arm64 .
            docker push ghcr.io/chuckhend/pglater-pg:v${{ steps.versions.outputs.TAG_VER }}-arm64
            docker push ghcr.io/chuckhend/pglater-pg:latest-arm64

  create_manifest:
    name: Create and Push Manifest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [build_and_push_arm64, build_and_push_amd64]
    outputs:
      short_sha: ${{ steps.versions.outputs.SHORT_SHA }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set version strings
        id: versions
        run: |
          TAG_VER=$(grep -m 1 '^version' Cargo.toml | sed -e 's/[^"]*"\([^"]*\)"/\1/')
          test -n "$TAG_VER"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "TAG_VER=$TAG_VER" >> $GITHUB_OUTPUT

      - name: Create and push Docker manifest -- Commit
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/chuckhend/pglater-pg:${{ steps.versions.outputs.SHORT_SHA }} \
            ghcr.io/chuckhend/pglater-pg:${{ steps.versions.outputs.SHORT_SHA }}-arm64 \
            ghcr.io/chuckhend/pglater-pg:${{ steps.versions.outputs.SHORT_SHA }}-amd64

      - name: Create and push Docker manifest -- Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker buildx imagetools create \
            -t ghcr.io/chuckhend/pglater-pg:latest \
            ghcr.io/chuckhend/pglater-pg:latest-arm64 \
            ghcr.io/chuckhend/pglater-pg:latest-amd64

          docker buildx imagetools create \
            -t ghcr.io/chuckhend/pglater-pg:v${{ steps.versions.outputs.TAG_VER }} \
            ghcr.io/chuckhend/pglater-pg:v${{ steps.versions.outputs.TAG_VER }}-arm64 \
            ghcr.io/chuckhend/pglater-pg:v${{ steps.versions.outputs.TAG_VER }}-amd64
