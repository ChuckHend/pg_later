[package]
name = "pg_later"
version = "0.5.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg18"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19"]
pg_test = []

[dependencies]
anyhow = "1.0.72"
chrono = {version = "0.4.26", features = ["serde"] }
log = "0.4.19"
pgmq = "0.33.7"
pgrx = "=0.20.1"
serde = "1.0.164"
serde_json = "1.0.99"
sqlparser = "0.47"
sqlx = { version = "0.8", features = [
    "postgres",
    "chrono",
    "json"
] }
tokio = "1.29.1"
url = "2.4.0"
postgres-types = "0.2.5"

[dev-dependencies]
pgrx-tests = "=0.20.1"
rand = "0.8.5"
tokio = { version = "1", features = ["macros"] }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
